# Golden Dataset: versao original (sem prompt_sistema)
description: 'Lia - campanha formal - original - 40 casos x 3'
prompts:
  - '{{mensagem}}'
providers:
  - id: file://./src/promptfoo-provider.cjs
    label: 'Lia original formal'
    config:
      versao: original
tests:
  - file://./data/golden-dataset/*.yaml
evaluateOptions:
  repeat: 3
  maxConcurrency: 1
  cache: false
