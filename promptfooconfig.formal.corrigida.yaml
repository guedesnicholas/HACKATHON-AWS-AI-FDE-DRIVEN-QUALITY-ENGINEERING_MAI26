# Golden Dataset: versao corrigida (envia prompts/lia-corrigida.txt em prompt_sistema)
description: 'Lia - campanha formal - corrigida - 40 casos x 3'
prompts:
  - '{{mensagem}}'
providers:
  - id: file://./src/promptfoo-provider.cjs
    label: 'Lia corrigida formal'
    config:
      versao: corrigida
tests:
  - file://./data/golden-dataset/*.yaml
evaluateOptions:
  repeat: 3
  maxConcurrency: 1
  cache: false
