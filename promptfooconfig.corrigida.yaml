# Este arquivo configura a avaliação automatizada da versão corrigida da Lia.
description: 'Lia - avaliação corrigida'
prompts:
  - '{{mensagem}}'
providers:
  - id: file://./src/promptfoo-provider.cjs
    label: 'Lia corrigida'
    config:
      versao: corrigida
tests:
  - file://./data/golden-dataset/*.yaml
evaluateOptions:
  repeat: 3
  maxConcurrency: 4
  cache: false
